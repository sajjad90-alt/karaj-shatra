function sendOrder(){const p=J('karaj_rider'),dest=$('dst').value;if(!dest)return toast('اختر الوجهة');if(!pin)return toast('حدد موقعك على الخريطة أولاً');if(!uid)return toast('انتظر اتصال السيرفر');
 db.collection('orders').add({rid:uid,name:p.name,phone:p.phone,lat:pin.lat,lng:pin.lng,near:$('near').value.trim(),dest,when:$('wn').value+($('tm').value&&$('wn').value!='الآن'?' '+$('tm').value:''),status:'open',at:Date.now()}).then(r=>{localStorage.setItem('karaj_order',r.id);notify('new',r.id);riderV()}).catch(e=>toast('خطأ: '+(e.code||e.message)))}

 else if(o.status=='accepted'){a.innerHTML=`<div class="card" style="cursor:default"><i>✅</i><b>قبل طلبك سائق</b><p><b>${esc(o.driverName)}</b><br>${esc(o.car)} - لوحة ${esc(o.plate)}<br>سعر الرحلة: <b>${fmt(o.price)}</b></p><a href="tel:${esc(o.driverPhone)}"><button class="y">📞 اتصال</button></a> <a href="${esc(wa(o.driverPhone))}" target="_blank"><button>💬 واتساب</button></a></div><button style="width:100%" onclick="endOrder('done')">تمت الرحلة</button><button style="width:100%;margin-top:8px;background:#c0392b" onclick="complain('rider')">⚠️ تقديم شكوى</button>`;localStorage.setItem('karaj_lo',JSON.stringify({id,uid:o.driverId,name:o.driverName,phone:o.driverPhone}))}
 else{localStorage.removeItem('karaj_order');riderV()}}))}

function driverV(){const p=J('karaj_driver'),a=$('app');clr();
 if(!p){a.innerHTML=`<div class="card" style="cursor:default"><i>🚗</i><b>تسجيل السائق</b><input id="dn" placeholder="الاسم الكامل"><input id="dp" type="tel" inputmode="numeric" maxlength="11" placeholder="رقم الهاتف 07XXXXXXXXX"><input id="dc" placeholder="نوع السيارة (مثال: كيا أوبتيما 2018)"><input id="dl" placeholder="رقم اللوحة"><p style="text-align:right;margin:8px 0"><b>الوجهات التي تسافر إليها:</b></p><div style="text-align:right">${DEST.map(d=>`<label style="display:inline-block;width:48%;padding:5px"><input type="checkbox" class="dd" value="${d}" style="width:auto;margin:0 0 0 4px">${d}</label>`).join('')}</div><button class="y" style="width:100%;margin-top:10px" onclick="saveDriver()">تسجيل</button></div>`+BK;return}
 a.innerHTML=`<div class="card" style="cursor:default"><i>🚗</i><b>${esc(p.name)}</b><p>${esc(p.car)} - ${esc(p.plate)}<br>وجهاتك: ${p.dests.join('، ')}</p><button id="av" onclick="toggleAv()"></button></div><div id="trip"></div><div id="reqs"></div><button style="width:100%;margin-top:8px;background:#889" onclick="ask('تغيير بيانات السائق؟',()=>{localStorage.removeItem('karaj_driver');driverV()})">تغيير بياناتي</button>`+PB+CBD+BK;
 paintAv();myTrip=null;openOrders=[];seen=null;
 unsub.push(db.collection('orders').where('status','==','open').onSnapshot(s=>{openOrders=s.docs.map(d=>({id:d.id,...d.data()}));chkNew();paintReqs()},e=>toast('خطأ: '+(e.code||e.message))));

function paintReqs(){if(v!='driver'||!$('reqs'))return;const p=J('karaj_driver'),on=localStorage.getItem('karaj_avail')=='1',keep={};if(myTrip)localStorage.setItem('karaj_lo_d',JSON.stringify({id:myTrip.id,uid:myTrip.rid,name:myTrip.name,phone:myTrip.phone}));
 document.querySelectorAll('[id^=pr]').forEach(e=>keep[e.id]=e.value);

 if(myTrip){$('reqs').innerHTML='';return}
 if(!on){$('reqs').innerHTML='<div class="card" style="cursor:default">اضغط «متاح» لتستقبل الطلبات</div>';return}
 const r=openOrders.filter(o=>p.dests.includes(o.dest)).sort((a,b)=>b.at-a.at);
 $('reqs').innerHTML=r.length?r.map(o=>`<div class="card" style="cursor:default"><b>🧍 ${esc(o.name)}</b><p>إلى <b>${esc(o.dest)}</b> - ${esc(o.when||'الآن')}<br>${esc(o.near)}</p><a href="https://www.google.com/maps?q=${+o.lat},${+o.lng}" target="_blank">📍 افتح موقع الراكب</a><input id="pr${o.id}" type="number" inputmode="numeric" placeholder="سعر الرحلة بالدينار"><button class="y" style="width:100%" onclick="accept('${o.id}')">✅ قبول الطلب</button></div>`).join(''):'<div class="card" style="cursor:default">لا توجد طلبات الآن، انتظر...</div>';
 for(const k in keep){const e=$(k);if(e)e.value=keep[k]}}
function accept(id){const price=+$('pr'+id).value,p=J('karaj_driver'),ro=openOrders.find(x=>x.id==id);if(price<1000)return toast('اكتب سعر الرحلة أولاً');const ref=db.collection('orders').doc(id);

 if(o.name.length<3||!o.car||!o.plate)return toast('أكمل كل البيانات');if(!/^07\d{9}$/.test(phone))return toast('رقم الهاتف غير صحيح، مثال: 07701234567');if(!dests.length)return toast('اختر وجهة واحدة على الأقل');if(!uid)return toast('انتظر اتصال السيرفر ثم أعد المحاولة');

function saveRider(){const name=$('rn').value.trim(),phone=dg($('rp').value.trim());

   return `<div class="card" style="cursor:default;text-align:right"><b>${x.from=='rider'?'🧍 راكب':'🚗 سائق'}: ${esc(x.fromName)} (${esc(x.fromPhone)})</b><br>يشكو من: <b>${esc(x.againstName)} (${esc(x.againstPhone)})</b><p>${esc(x.text)}</p><small>${new Date(x.at).toLocaleString('ar-IQ')}</small><br><br>${B(i)} <button style="background:#889" onclick="adb.collection('complaints').doc('${esc(x.id)}').update({status:'closed'})">✔️ إغلاق</button></div>`}).join(''):'<div class="card" style="cursor:default">لا توجد شكاوى جديدة</div>'}
 else if(atab=='u')el.innerHTML=[['drivers','🚗','السواق','d'],['riders','🧍','الركاب','r']].map(([c,ic,t,k])=>`<h3>${ic} ${t} (${data[k].length})</h3>`+data[k].map(x=>`<div class="card" style="cursor:default;text-align:right;padding:12px"><b>${esc(x.name)}</b> ${esc(x.phone)}<br>${c=='drivers'?`${esc(x.car)} - ${esc(x.plate)}<br>الوجهات: ${esc((x.dests||[]).join('، '))}<br>${x.avail?'🟢 متاح':'⚪ غير متاح'}<br>`:''}<small>سُجّل: ${x.at?new Date(x.at).toLocaleDateString('ar-IQ'):'-'} | رحلات منتهية: ${data.o.filter(o=>(c=='drivers'?o.driverId:o.rid)==x.id&&o.status=='done').length}</small><br>${B(T(x,c.slice(0,-1)))}</div>`).join('')).join('');

function warnU(i){const x=AL[i];inp('نص التنبيه إلى '+x.name,t=>{if(!t)return;adb.collection(x.role+'s').doc(x.id).update({warn:t,warnAt:Date.now()}).then(()=>toast('أُرسل التنبيه ✅')).catch(e=>toast('خطأ: '+(e.code||e.message)))})}

 .then(()=>{if(x.cid)adb.collection('complaints').doc(x.cid).update({status:'closed'});toast('تم الحظر والحذف ✅')}).catch(e=>toast('خطأ: '+(e.code||e.message)))})}
let map=null,mk=null,pin=null;
function initMap(){const el=$('map');if(!el)return;if(!window.L)return toast('تعذر تحميل الخريطة، تأكد من الإنترنت');if(map){map.remove();map=null}
 const c=pin||{lat:31.4164,lng:46.1692};map=L.map('map').setView([c.lat,c.lng],14);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 mk=L.marker([c.lat,c.lng],{draggable:true,icon:L.divIcon({html:'<div style="font-size:34px;line-height:34px">📍</div>',className:'',iconSize:[34,34],iconAnchor:[17,34]})}).addTo(map);
 if(pin)setPin(pin.lat,pin.lng,false);
 mk.on('dragend',()=>{const p=mk.getLatLng();setPin(p.lat,p.lng,false)});
 map.on('click',e=>{mk.setLatLng(e.latlng);setPin(e.latlng.lat,e.latlng.lng,false)})}
function setPin(lat,lng,move){pin={lat,lng};if(move&&map){mk.setLatLng([lat,lng]);map.setView([lat,lng],17)}const e=$('loc');if(e)e.textContent='✅ تم تحديد الموقع: '+lat.toFixed(5)+' , '+lng.toFixed(5)}
function myLoc(){if(!navigator.geolocation)return toast('الجهاز لا يدعم تحديد الموقع');toast('جارٍ تحديد موقعك...');navigator.geolocation.getCurrentPosition(p=>setPin(p.coords.latitude,p.coords.longitude,true),e=>toast(e.code==1?'لم تسمح للتطبيق بالموقع: فعّل الإذن من إعدادات المتصفح':'تعذر تحديد الموقع، تأكد من تشغيل GPS'),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
const NAV=(la,ln)=>`https://www.google.com/maps/dir/?api=1&destination=${+la},${+ln}&travelmode=driving`;

function listV(){const k=v;clr();$('app').innerHTML=`<div class="card" style="cursor:default"><b>${k=='drivers'?'🚖 السواق ووجهاتهم':'🧳 طلبات الركاب'}</b><select id="fd" onchange="paintL()"><option value="">كل الوجهات</option>${DEST.map(d=>`<option>${d}</option>`).join('')}</select></div><div id="ll"></div>`+BK;

 unsub.push(q.onSnapshot(s=>{LD=s.docs.map(d=>({id:d.id,...d.data()}));paintL()},e=>toast('خطأ: '+(e.code||e.message))))}
function paintL(){const el=$('ll');if(!el)return;const f=$('fd').value,k=v;let r=LD.filter(x=>!f||(k=='drivers'?(x.dests||[]).includes(f):x.dest==f));
 k=='drivers'?r.sort((a,b)=>(b.avail?1:0)-(a.avail?1:0)):r.sort((a,b)=>b.at-a.at);
 el.innerHTML=r.length?r.map(x=>k=='drivers'?`<div class="card" style="cursor:default;text-align:right"><b>${esc(x.name)}</b> ${x.avail?'🟢 متاح':'⚪ غير متاح'}<br>${esc(x.car)} - ${esc(x.plate)}<br><small>وجهاته: ${esc((x.dests||[]).join('، '))}</small><br><a href="${esc(WM(x.phone,'السلام عليكم، أنا من تطبيق كراج الشطرة وأريد التفاهم على رحلة'))}" target="_blank"><button class="y" style="width:100%;margin-top:8px">💬 واتساب</button></a></div>`
 :`<div class="card" style="cursor:default;text-align:right"><b>${esc(x.name)}</b><br>إلى <b>${esc(x.dest)}</b> - ${esc(x.when||'الآن')}<br><small>${esc(x.near)}</small><br><a href="${esc(WM(x.phone,'السلام عليكم، أنا سائق من كراج الشطرة وأريد التفاهم على رحلتك إلى '+x.dest))}" target="_blank"><button class="y" style="width:100%;margin-top:8px">💬 واتساب</button></a></div>`).join(''):'<div class="card" style="cursor:default">لا توجد نتائج</div>'}

function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(c.currentTime+.4)}catch(e){}}
function chkNew(){const p=J('karaj_driver'),on=localStorage.getItem('karaj_avail')=='1',mine=openOrders.filter(o=>p&&(p.dests||[]).includes(o.dest)).map(o=>o.id);
 if(seen&&on&&mine.some(i=>!seen.has(i))){beep();navigator.vibrate&&navigator.vibrate([250,120,250]);toast('طلب جديد 🚖')}seen=new Set(mine)}

function STATS(){const o=data.o,t=new Date().setHours(0,0,0,0),cnt={};o.forEach(x=>cnt[x.dest]=(cnt[x.dest]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([d,n])=>`<p>${esc(d)}: ${n}</p>`).join(''),K=(a,b)=>`<div class="card" style="cursor:default;padding:12px"><b>${a}</b><br>${b}</div>`,n=s=>o.filter(x=>x.status==s).length;
 return K('السواق',`${data.d.length} مسجّل، ${data.d.filter(x=>x.avail).length} متاح الآن`)+K('الركاب',data.r.length+' مسجّل')+K('طلبات اليوم',o.filter(x=>x.at>=t).length)+K('كل الطلبات',`مفتوحة ${n('open')} | مقبولة ${n('accepted')} | منتهية ${n('done')} | ملغاة ${n('cancelled')}`)+K('أكثر الوجهات طلباً',top||'-')}
