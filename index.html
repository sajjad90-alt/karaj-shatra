<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d91"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><title>كراج الشطرة</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--b:#0b3d91;--y:#ffc107;--bg:#f4f7fc;--tx:#14213d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--b);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;text-align:center;border-bottom:5px solid var(--y);border-radius:0 0 22px 22px}
header h1{margin:0;font-size:24px}header small{color:var(--y)}
#app{padding:18px 14px calc(30px + env(safe-area-inset-bottom));max-width:520px;margin:auto}
.card{background:#fff;border-radius:20px;padding:22px 14px;text-align:center;box-shadow:0 4px 14px rgba(11,61,145,.12);margin:14px 0;cursor:pointer;border:2px solid transparent}
.card:active{border-color:var(--y)}.card i{display:block;font-style:normal;font-size:46px;margin-bottom:6px}
.card b{font-size:19px;color:var(--b)}.card p{margin:6px 0 0;color:#667}
#map{height:320px;border-radius:16px;z-index:0;margin:8px 0}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #9bb4e0;border-radius:12px;font:inherit;background:#fff}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:var(--b);color:#fff;cursor:pointer}
button.y{background:var(--y);color:var(--tx);font-weight:bold}
.ver{text-align:center;color:#99a;font-size:12px;margin-top:24px}
</style></head><body>
<header><h1>🚖 كراج الشطرة</h1><small>سفر آمن بين المحافظات</small></header>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FB={apiKey:"AIzaSyDvYj0bbesS6xTL22XF59EaA7No05rEA7w",authDomain:"karaj-shatra.firebaseapp.com",projectId:"karaj-shatra",storageBucket:"karaj-shatra.firebasestorage.app",messagingSenderId:"400980272926",appId:"1:400980272926:web:a5d10fc103ffd5f46dcb0f"};
let db=null,uid=null,st='⏳ جارٍ الاتصال بالسيرفر...';
function setSt(t){st=t;const e=document.getElementById('st');if(e)e.textContent=t}
function initFB(){try{firebase.initializeApp(FB);db=firebase.firestore();
 firebase.auth().signInAnonymously().then(u=>{uid=u.user.uid;return db.collection('ping').doc(uid).set({t:Date.now()})})
 .then(()=>setSt('✅ متصل بالسيرفر')).catch(e=>setSt('❌ خطأ: '+(e.code||e.message)))}catch(e){setSt('❌ '+e.message)}}
const VER='1.4 - المرحلة 3 (قمر صناعي)';let v='home';
const $=id=>document.getElementById(id);
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0b3d91;color:#fff;padding:12px 20px;border-radius:14px;z-index:120;max-width:85%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3)';document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function ask(m,ok){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:120;display:flex;align-items:center;justify-content:center';d.innerHTML=`<div style="background:#fff;padding:20px;width:80%;max-width:320px;text-align:center;border-radius:18px"><p style="font-weight:bold">${m}</p><button id="y" class="y" style="margin:4px">نعم</button><button id="n" style="margin:4px;background:#889">إلغاء</button></div>`;document.body.appendChild(d);d.querySelector('#y').onclick=()=>{d.remove();ok()};d.querySelector('#n').onclick=()=>d.remove()}
const P=()=>{try{return JSON.parse(localStorage.getItem('karaj_rider')||'null')}catch(e){return null}};
function riderV(){const p=P(),a=$('app');
 if(!p){a.innerHTML=`<div class="card" style="cursor:default"><i>🧍</i><b>تسجيل الراكب</b><input id="rn" placeholder="الاسم الكامل"><input id="rp" type="tel" inputmode="numeric" placeholder="رقم الهاتف 07XXXXXXXXX" maxlength="11"><button class="y" style="width:100%" onclick="saveRider()">تسجيل</button></div><button style="width:100%" onclick="go('home')">رجوع</button>`;return}
 a.innerHTML=`<div class="card" style="cursor:default"><i>👋</i><b>أهلاً ${p.name}</b><p>${p.phone}</p></div><div class="card" style="cursor:default;padding:14px"><b>🗺️ حدّد موقعك</b><div id="map"></div><div id="loc" style="margin:8px 0;font-size:14px">لم تحدد موقعك بعد: اضغط على الخريطة أو اسحب الدبوس أو استخدم زر موقعي</div><button class="y" style="width:100%" onclick="myLoc()">📍 موقعي الحالي</button><button style="width:100%;margin-top:8px" onclick="toggleSat()">🛰️ تبديل: قمر صناعي / خريطة عادية</button></div><button style="width:100%;margin-bottom:8px" onclick="toast(pin?'تُفعَّل الخطوة القادمة: الوجهة وإرسال الطلب':'حدد موقعك أولاً')">🚖 اطلب سيارة</button><button style="width:100%;margin-bottom:8px" onclick="ask('تغيير بيانات التسجيل؟',()=>{localStorage.removeItem('karaj_rider');riderV()})">تغيير بياناتي</button><button class="y" style="width:100%" onclick="go('home')">رجوع</button>`;setTimeout(initMap,50)}
function saveRider(){const name=$('rn').value.trim(),phone=$('rp').value.trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
 if(name.length<3)return toast('اكتب اسمك الكامل');if(!/^07\d{9}$/.test(phone))return toast('رقم الهاتف غير صحيح، مثال: 07701234567');if(!uid)return toast('انتظر اتصال السيرفر ثم أعد المحاولة');
 db.collection('riders').doc(uid).set({name,phone,at:Date.now()}).then(()=>{localStorage.setItem('karaj_rider',JSON.stringify({name,phone}));toast('تم التسجيل ✅');riderV()}).catch(e=>toast('خطأ: '+(e.code||e.message)))}
let map=null,mk=null,pin=null,lays={},curL='sat';
function toggleSat(){if(!map)return;map.removeLayer(lays[curL]);curL=curL=='sat'?'osm':'sat';lays[curL].addTo(map);localStorage.setItem('karaj_layer',curL);toast(curL=='sat'?'🛰️ قمر صناعي':'🗺️ خريطة عادية')}
function initMap(){const el=$('map');if(!el)return;if(!window.L)return toast('تعذر تحميل الخريطة، تأكد من الإنترنت');if(map){map.remove();map=null}
 const c=pin||{lat:31.4164,lng:46.1692};map=L.map('map').setView([c.lat,c.lng],14);
 lays={osm:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap'}),
  sat:L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:18,attribution:'Tiles © Esri'}),L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:18})])};
 curL=localStorage.getItem('karaj_layer')||'sat';lays[curL].addTo(map);
 mk=L.marker([c.lat,c.lng],{draggable:true,icon:L.divIcon({html:'<div style="font-size:34px;line-height:34px">📍</div>',className:'',iconSize:[34,34],iconAnchor:[17,34]})}).addTo(map);
 if(pin)setPin(pin.lat,pin.lng,false);
 mk.on('dragend',()=>{const p=mk.getLatLng();setPin(p.lat,p.lng,false)});
 map.on('click',e=>{mk.setLatLng(e.latlng);setPin(e.latlng.lat,e.latlng.lng,false)})}
function setPin(lat,lng,move){pin={lat,lng};if(move&&map){mk.setLatLng([lat,lng]);map.setView([lat,lng],18)}const e=$('loc');if(e)e.textContent='✅ تم تحديد الموقع: '+lat.toFixed(5)+' , '+lng.toFixed(5)}
function myLoc(){if(!navigator.geolocation)return toast('الجهاز لا يدعم تحديد الموقع');toast('جارٍ تحديد موقعك...');navigator.geolocation.getCurrentPosition(p=>setPin(p.coords.latitude,p.coords.longitude,true),()=>toast('فعّل خدمة الموقع وأذن للتطبيق'),{enableHighAccuracy:true,timeout:15000})}
function go(x){v=x;draw();scrollTo(0,0)}
function draw(){const a=$('app');
 if(v=='home')a.innerHTML=`<div class="card" onclick="go('rider')"><i>🧍</i><b>أنا راكب</b><p>اطلب سيارة لوجهتك</p></div>
  <div class="card" onclick="go('driver')"><i>🚗</i><b>أنا سائق</b><p>استقبل طلبات الركاب</p></div><div class="ver">الإصدار ${VER}</div><div class="ver" id="st" style="font-weight:bold">${st}</div>`;
 else if(v=='rider')riderV();
 else a.innerHTML=`<div class="card" style="cursor:default"><i>${v=='rider'?'🧍':'🚗'}</i><b>${v=='rider'?'شاشة الراكب':'شاشة السائق'}</b><p>تُفعَّل في المرحلة القادمة</p></div><button class="y" style="width:100%" onclick="go('home')">رجوع</button>`;
 if(v=='driver')toast('تعمل الواجهة بنجاح ✅')}
initFB();draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
